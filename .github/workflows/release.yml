name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenMonitor-${{ github.ref_name }}.apk

      - name: Generate SHA-256 Checksum
        run: sha256sum ScreenMonitor-${{ github.ref_name }}.apk > ScreenMonitor-${{ github.ref_name }}.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenMonitor-${{ github.ref_name }}.apk
            ScreenMonitor-${{ github.ref_name }}.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
